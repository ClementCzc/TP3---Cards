<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Card05 Social Card</title>
  </head>
  <body>
    <main> 
        <div class="top-box">
            <h1>Hi George</h1>
            <p>You can contact us whenever you need help 
              or just curious about something</p>
        </div>
        <article class="card">
            <h2>Start Chatting</h2>
            <div class="avatar">
                <img src="https://i.pravatar.cc/300" alt="avatar"/>
            </div>
            <p class="name">Essie Walton</p>
            <p class="status"><span class="status-dot"></span>Active</p>
            <a href="#">Send a message</a>
      </article>
    </main>
  </body>
</html>
